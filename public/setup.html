<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUXE — নতুন দোকান খুলুন</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/setup.css" />
  <link rel="stylesheet" href="/css/shop-address.css?v=1" />
</head>
<body class="auth-body">
  <main class="setup-wrap">
    <section class="card">
      <div class="setup-head">
        <div class="brand-mark small">L</div>
        <h2>নতুন দোকান খুলুন</h2>
        <p class="sub" id="whoLine">আপনার প্ল্যান বেছে দোকান চালু করুন</p>
      </div>

      <form id="setupForm" novalidate>
        <div class="field">
          <label for="sName">দোকানের নাম</label>
          <input id="sName" type="text" required placeholder="যেমন: Aarong Style" />
        </div>

        <div class="field">
          <label for="sSlug">দোকানের ঠিকানা</label>
          <div class="addr-field">
            <input id="sSlug" type="text" placeholder="amar-dokan" spellcheck="false" autocomplete="off" autocapitalize="none" aria-describedby="sSlugUrl sSlugStatus sSlugRule" />
            <span class="addr-suffix" id="sSlugSuffix" hidden></span>
          </div>
          <p class="addr-url" id="sSlugUrl" hidden></p>
          <p class="addr-status" id="sSlugStatus" role="status" aria-live="polite" hidden></p>
          <div class="addr-suggest" id="sSlugSuggest" hidden></div>
          <p class="hint addr-rule" id="sSlugRule"></p>
        </div>

        <div class="field">
          <label>প্ল্যান নির্বাচন করুন</label>
          <div class="plan-list" id="planList">
            <div class="plan-skeleton">প্ল্যান লোড হচ্ছে...</div>
          </div>
        </div>

        <button class="btn-gold" id="submitBtn" type="submit">দোকান তৈরি করুন</button>
        <p class="msg" id="msg"></p>
      </form>

      <p class="switch">দোকান আছে? <button type="button" id="goDash">ড্যাশবোর্ডে যান</button></p>
    </section>
  </main>

  <script src="/js/shop-address.js?v=1"></script>
  <script src="/js/shop-address-field.js?v=1"></script>
  <script src="/js/setup.js?v=3"></script>
</body>
</html>
