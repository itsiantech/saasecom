# amarbazaar.bd vhost — platform side
#   amarbazaar.bd / www → platform landing + account + superadmin pages (Express :5000)
#   api.amarbazaar.bd    → backend + superadmin panel only (hostGate blocks shop pages)
# Shop subdomains live in amarbazaar-shops.conf.

server {
    listen 80;
    server_name amarbazaar.bd www.amarbazaar.bd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name amarbazaar.bd www.amarbazaar.bd;

    ssl_certificate /etc/letsencrypt/live/amarbazaar.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amarbazaar.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.amarbazaar.bd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.amarbazaar.bd;

    ssl_certificate /etc/letsencrypt/live/amarbazaar.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amarbazaar.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
