# *.amarbazaar.bd vhost — one host per shop
#   storefront (Next :3000) on /, plus the store panel (Express :5000):
#   panel pages, panel assets and admin APIs go to the backend so the Host
#   header still resolves the shop; the cart bridge stays on Next because it
#   owns the httpOnly cart_sid cookie.

server {
    listen 80;
    server_name *.amarbazaar.bd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.amarbazaar.bd;

    ssl_certificate /etc/letsencrypt/live/amarbazaar.bd-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amarbazaar.bd-0001/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # store admin panel
    location = /dashboard.html { proxy_pass http://127.0.0.1:5000; }
    location = /settings.html  { proxy_pass http://127.0.0.1:5000; }
    location = /portal.html    { proxy_pass http://127.0.0.1:5000; }
    location = /login.html     { proxy_pass http://127.0.0.1:5000; }
    location = /account.html   { proxy_pass http://127.0.0.1:5000; }
    location ^~ /css/          { proxy_pass http://127.0.0.1:5000; }
    location ^~ /js/           { proxy_pass http://127.0.0.1:5000; }
    location ^~ /uploads/      { proxy_pass http://127.0.0.1:5000; }

    # storefront bridge — keeps its httpOnly cart cookie and tenant hint
    location = /api/cart       { proxy_pass http://127.0.0.1:3000; }
    location ^~ /api/cart/     { proxy_pass http://127.0.0.1:3000; }
    location ^~ /api/public/   { proxy_pass http://127.0.0.1:3000; }

    # admin APIs (and auth) go straight to the backend; Host resolves the shop
    location ^~ /api/ { proxy_pass http://127.0.0.1:5000; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
